[workspace]

[package]
name = "sorogov-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "~1.3.0", features = ["derive"] }
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[dependencies.sorogov-governor]
path = "../contracts/governor"

[dependencies.sorogov-treasury]
path = "../contracts/treasury"

[dependencies.sorogov-timelock]
path = "../contracts/timelock"

[dependencies.sorogov-proposal-bonds]
path = "../contracts/proposal-bonds"

[dependencies.sorogov-vote-escrow]
path = "../contracts/vote-escrow"

[dependencies.sorogov-voting-rewards]
path = "../contracts/voting-rewards"

[[bin]]
name = "governor_state"
path = "fuzz_targets/governor_state.rs"
doc = false

[[bin]]
name = "multi_action_proposal"
path = "fuzz_targets/multi_action_proposal.rs"
doc = false

[[bin]]
name = "treasury_streams"
path = "fuzz_targets/treasury_streams.rs"
doc = false

[[bin]]
name = "timelock"
path = "fuzz_targets/timelock.rs"
doc = false

[[bin]]
name = "proposal_bonds"
path = "fuzz_targets/proposal_bonds.rs"
doc = false

[[bin]]
name = "vote_escrow"
path = "fuzz_targets/vote_escrow.rs"
doc = false

[[bin]]
name = "voting_rewards_merkle"
path = "fuzz_targets/voting_rewards_merkle.rs"
doc = false
