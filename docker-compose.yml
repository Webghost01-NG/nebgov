version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nebgov}
      POSTGRES_USER: ${POSTGRES_USER:-nebgov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nebgov}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nebgov_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  indexer:
    build:
      context: .
      dockerfile: packages/indexer/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nebgov}:${POSTGRES_PASSWORD:-nebgov}@db:5432/${POSTGRES_DB:-nebgov}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      STELLAR_NETWORK_PASSPHRASE: "${STELLAR_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}"
      GOVERNOR_ADDRESS: ${GOVERNOR_ADDRESS:-}
      WRAPPER_ADDRESS: ${WRAPPER_ADDRESS:-}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-}
      TREASURY_STRATEGIES_ADDRESS: ${TREASURY_STRATEGIES_ADDRESS:-}
      TREASURY_SIMULATION_ACCOUNT: ${TREASURY_SIMULATION_ACCOUNT:-}
      LIQUIDITY_ADDRESS: ${LIQUIDITY_ADDRESS:-}
      SIGNAL_ANCHOR_ADDRESS: ${SIGNAL_ANCHOR_ADDRESS:-}
      CO_SPONSORSHIP_ADDRESS: ${CO_SPONSORSHIP_ADDRESS:-}
      TOKEN_VOTES_ADDRESS: ${TOKEN_VOTES_ADDRESS:-}
      TIMELOCK_ADDRESS: ${TIMELOCK_ADDRESS:-}
      CONVICTION_VOTING_ADDRESS: ${CONVICTION_VOTING_ADDRESS:-}
      PROPOSAL_BONDS_ADDRESS: ${PROPOSAL_BONDS_ADDRESS:-}
      OPTIMISTIC_GOVERNOR_ADDRESS: ${OPTIMISTIC_GOVERNOR_ADDRESS:-}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      PORT: 3002
    ports:
      - "${INDEXER_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nebgov}:${POSTGRES_PASSWORD:-nebgov}@db:5432/${POSTGRES_DB:-nebgov}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      # Stellar / on-chain configuration
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      GOVERNOR_CONTRACT_ID: ${GOVERNOR_CONTRACT_ID:-}
      TOKEN_VOTES_CONTRACT_ID: ${TOKEN_VOTES_CONTRACT_ID:-}
      TIMELOCK_CONTRACT_ID: ${TIMELOCK_CONTRACT_ID:-}
      TREASURY_CONTRACT_ID: ${TREASURY_CONTRACT_ID:-}
      SIGNAL_ANCHOR_CONTRACT_ID: ${SIGNAL_ANCHOR_CONTRACT_ID:-}
      VOTING_REWARDS_CONTRACT_ID: ${VOTING_REWARDS_CONTRACT_ID:-}
      PROPOSAL_SIMULATION_ACCOUNT: ${PROPOSAL_SIMULATION_ACCOUNT:-}
      # Gasless delegation relayer
      RELAYER_SECRET_KEY: ${RELAYER_SECRET_KEY:-}
      RELAYER_DAILY_PERMIT_LIMIT: ${RELAYER_DAILY_PERMIT_LIMIT:-5}
      # Signal-anchor polling
      SIGNAL_ANCHOR_INTERVAL_MS: ${SIGNAL_ANCHOR_INTERVAL_MS:-30000}
      SIGNAL_ANCHOR_ON_CHAIN: ${SIGNAL_ANCHOR_ON_CHAIN:-false}
      SIGNAL_RESULTS_CACHE_TTL_MS: ${SIGNAL_RESULTS_CACHE_TTL_MS:-15000}
      # Governance tuning
      INDEXER_URL: ${INDEXER_URL:-http://indexer:3002}
      # Voting rewards
      VOTING_REWARDS_EPOCH_BUDGET: ${VOTING_REWARDS_EPOCH_BUDGET:-}
      VOTING_REWARDS_INTERVAL_MS: ${VOTING_REWARDS_INTERVAL_MS:-60000}
      VOTING_REWARDS_AUTO_ROLL: ${VOTING_REWARDS_AUTO_ROLL:-false}
      # Notifications
      NOTIFICATION_PROCESSOR_INTERVAL_MS: ${NOTIFICATION_PROCESSOR_INTERVAL_MS:-10000}
      DELIVERY_RETRY_INTERVAL_MS: ${DELIVERY_RETRY_INTERVAL_MS:-15000}
      EMAIL_PROVIDER_API_URL: ${EMAIL_PROVIDER_API_URL:-}
      EMAIL_PROVIDER_API_KEY: ${EMAIL_PROVIDER_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-notifications@nebgov.dev}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Leaderboard snapshots
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-90}
      SNAPSHOT_MIN_DELTA: ${SNAPSHOT_MIN_DELTA:-0}
      # Security monitoring
      SECURITY_LARGE_TRANSFER_THRESHOLD: ${SECURITY_LARGE_TRANSFER_THRESHOLD:-1000000000000}
      SECURITY_ALERT_WEBHOOK_URL: ${SECURITY_ALERT_WEBHOOK_URL:-}
      SECURITY_SCAN_INTERVAL_MS: ${SECURITY_SCAN_INTERVAL_MS:-30000}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      indexer:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_GOVERNOR_ADDRESS: ${GOVERNOR_ADDRESS:-}
      NEXT_PUBLIC_TIMELOCK_ADDRESS: ${TIMELOCK_ADDRESS:-}
      NEXT_PUBLIC_VOTES_ADDRESS: ${TOKEN_VOTES_ADDRESS:-}
      NEXT_PUBLIC_PROPOSAL_BONDS_ADDRESS: ${PROPOSAL_BONDS_ADDRESS:-}
      NEXT_PUBLIC_GUARDIAN_COUNCIL_ADDRESS: ${GUARDIAN_COUNCIL_ADDRESS:-}
      NEXT_PUBLIC_OPTIMISTIC_GOVERNOR_ADDRESS: ${OPTIMISTIC_GOVERNOR_ADDRESS:-}
      NEXT_PUBLIC_SIGNAL_ANCHOR_ADDRESS: ${SIGNAL_ANCHOR_ADDRESS:-}
      NEXT_PUBLIC_CONVICTION_VOTING_ADDRESS: ${CONVICTION_VOTING_ADDRESS:-}
      NEXT_PUBLIC_TREASURY_STRATEGIES_ADDRESS: ${TREASURY_STRATEGIES_ADDRESS:-}
      NEXT_PUBLIC_NETWORK: ${NEXT_PUBLIC_NETWORK:-testnet}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
      NEXT_PUBLIC_INDEXER_URL: ${NEXT_PUBLIC_INDEXER_URL:-http://localhost:3002}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  nebgov_postgres_data:
